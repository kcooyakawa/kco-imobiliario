name: W3W localizar imagens
on:
  workflow_dispatch:
  push:
    paths: ['w3w-src/empreendimentos.json','w3w-src/localize.py']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow pillow-avif-plugin
      - run: cd w3w-src && python localize.py && python build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A w3w w3w-src w3w-img
          git diff --cached --quiet || (git commit -m "W3W: imagens externas hospedadas no site (automatico)" && git push)
